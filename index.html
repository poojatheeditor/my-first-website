<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffd6e7, #d9e7ff);
      min-height: 100vh;
      padding: 40px 15px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      max-width: 400px;
      margin: 50px auto;
      box-shadow: 0 5px 20px #0002;
    }
    h1 { color: #e84393; }
    button {
      background: #e84393;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 25px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome! 💗</h1>
    <p>This is my first website!</p>
    <button onclick="alert('Thank you for visiting! 💖')">
      Click Me
    </button>
  </div>
</body>
</html>
